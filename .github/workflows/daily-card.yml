name: Daily governance card

on:
  schedule:
    # 06:45 Jakarta time, Monday to Friday (23:45 UTC the evening before)
    - cron: "45 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image renderer
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Write and send today's card
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARD_MODEL: ${{ vars.CARD_MODEL }}
        run: python make_card.py

      - name: Save the card in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/
          git diff --cached --quiet || { git commit -m "Card $(TZ=Asia/Jakarta date +%F)"; git push; }
