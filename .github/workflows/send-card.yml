name: Send card to Telegram

on:
  push:
    paths:
      - "cards/**"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send new cards
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files=$(ls cards/*.txt | sort | tail -n 1)
          else
            files=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- cards/ || true)
          fi
          [ -z "$files" ] && { echo "No new cards."; exit 0; }
          for f in $files; do
            echo "Sending $f"
            curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text@${f}" \
              --data-urlencode "disable_web_page_preview=true" > /dev/null
          done
